<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>REACH</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0f172a;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      padding: 30px 18px;
    }

    main {
      width: 100%;
      max-width: 520px;
    }

    h1 {
      font-size: 48px;
      margin: 25px 0 0;
      letter-spacing: 5px;
    }

    .tagline {
      color: #94a3b8;
      margin: 4px 0 35px;
    }

    .card {
      background: #1e293b;
      border-radius: 22px;
      padding: 22px;
      margin-bottom: 18px;
    }

    h2 {
      margin-top: 0;
      font-size: 21px;
    }

    button, input {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 15px;
      font-size: 17px;
    }

    button {
      background: #6366f1;
      color: white;
      font-weight: 700;
      margin-top: 10px;
    }

    input {
      background: #334155;
      color: white;
      text-transform: uppercase;
      text-align: center;
      letter-spacing: 3px;
      margin: 5px 0;
    }

    #roomDisplay {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 6px;
      text-align: center;
      color: #a5b4fc;
      margin: 18px 0;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 14px;
      background: #172033;
      color: #cbd5e1;
      text-align: center;
    }

    .connected {
      color: #86efac !important;
    }

    small {
      color: #94a3b8;
      display: block;
      line-height: 1.5;
    }
  </style>
</head>

<body>
<main>
  <h1>REACH</h1>
  <div class="tagline">Making love not feel so distant.</div>

  <section class="card">
    <h2>Start a connection</h2>
    <small>Create a temporary room and send the code to your partner.</small>
    <button id="createBtn">Create room</button>
    <div id="roomDisplay">------</div>
  </section>

  <section class="card">
    <h2>Join your partner</h2>
    <input id="roomInput" maxlength="6" placeholder="ROOM CODE">
    <button id="joinBtn">Join room</button>
  </section>

  <div id="status">Ready to REACH.</div>
</main>

<script type="module">
  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

  import {
    getFirestore,
    doc,
    setDoc,
    getDoc,
    onSnapshot,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCz2DVsAyjUWiKLxChzPWhPO5Dg4BaddEM",
    authDomain: "reach-prototype-d70ef.firebaseapp.com",
    projectId: "reach-prototype-d70ef",
    storageBucket: "reach-prototype-d70ef.firebasestorage.app",
    messagingSenderId: "250530646851",
    appId: "1:250530646851:web:a2087cbf72cde0ffa5fdf6"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const createBtn = document.getElementById("createBtn");
  const joinBtn = document.getElementById("joinBtn");
  const roomInput = document.getElementById("roomInput");
  const roomDisplay = document.getElementById("roomDisplay");
  const status = document.getElementById("status");

  function makeRoomCode() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let code = "";

    for (let i = 0; i < 6; i++) {
      code += chars[Math.floor(Math.random() * chars.length)];
    }

    return code;
  }

  function watchRoom(code) {
    const roomRef = doc(db, "rooms", code);

    return onSnapshot(roomRef, (snapshot) => {
      if (!snapshot.exists()) return;

      const data = snapshot.data();

      if (data.joined === true) {
        status.textContent = "❤️ Partner connected to room " + code;
        status.classList.add("connected");
      }
    }, (error) => {
      status.textContent = "Firebase error: " + error.message;
    });
  }

  createBtn.addEventListener("click", async () => {
    try {
      createBtn.disabled = true;
      status.classList.remove("connected");
      status.textContent = "Creating room…";

      const code = makeRoomCode();
      const roomRef = doc(db, "rooms", code);

      await setDoc(roomRef, {
        createdAt: serverTimestamp(),
        joined: false
      });

      roomDisplay.textContent = code;
      status.textContent = "Room created. Give this code to your partner.";

      watchRoom(code);
    } catch (error) {
      status.textContent = "Could not create room: " + error.message;
      createBtn.disabled = false;
    }
  });

  joinBtn.addEventListener("click", async () => {
    const code = roomInput.value.trim().toUpperCase();

    if (code.length !== 6) {
      status.textContent = "Enter the 6-character room code.";
      return;
    }

    try {
      status.classList.remove("connected");
      status.textContent = "Looking for room…";

      const roomRef = doc(db, "rooms", code);
      const snapshot = await getDoc(roomRef);

      if (!snapshot.exists()) {
        status.textContent = "Room not found.";
        return;
      }

      await setDoc(roomRef, {
        joined: true,
        joinedAt: serverTimestamp()
      }, { merge: true });

      status.textContent = "❤️ Connected to your partner!";
      status.classList.add("connected");

    } catch (error) {
      status.textContent = "Could not join: " + error.message;
    }
  });
</script>
</body>
</html>
