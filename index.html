<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>REACH</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0f172a;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      padding: 30px 18px;
    }

    main {
      width: 100%;
      max-width: 520px;
    }

    h1 {
      font-size: 48px;
      margin: 25px 0 0;
      letter-spacing: 5px;
    }

    .tagline {
      color: #94a3b8;
      font-size: 20px;
      margin: 10px 0 45px;
    }

    .card {
      background: #1e293b;
      border-radius: 28px;
      padding: 30px;
      margin-bottom: 24px;
    }

    h2 {
      font-size: 27px;
      margin: 0 0 25px;
    }

    p {
      color: #94a3b8;
      font-size: 18px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 20px;
      background: #6366f1;
      color: white;
      font-size: 21px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
    }

    input {
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      background: #334155;
      color: white;
      text-align: center;
      font-size: 22px;
      text-transform: uppercase;
      letter-spacing: 5px;
      outline: none;
    }

    input::placeholder {
      color: #a3a3a3;
    }

    #roomCode {
      text-align: center;
      color: #a5b4fc;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: 8px;
      margin: 28px 0 5px;
      min-height: 48px;
    }

    #status {
      background: #172033;
      border-radius: 20px;
      padding: 20px;
      margin-top: 10px;
      text-align: center;
      color: #86efac;
      font-size: 18px;
      line-height: 1.4;
    }

    #authStatus {
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      margin-top: 20px;
    }

    .heart {
      color: #ef4444;
    }
  </style>
</head>

<body>
  <main>
    <h1>REACH</h1>
    <div class="tagline">Making love not feel so distant.</div>

    <section class="card">
      <h2>Start a connection</h2>
      <p>Create a temporary room and send the code to your partner.</p>

      <button id="createButton" onclick="createRoom()" disabled>
        Connecting securely...
      </button>

      <div id="roomCode">------</div>
    </section>

    <section class="card">
      <h2>Join your partner</h2>

      <input
        id="joinCode"
        maxlength="6"
        placeholder="ROOM CODE"
        autocomplete="off"
      >

      <button id="joinButton" onclick="joinRoom()" disabled>
        Connecting securely...
      </button>
    </section>

    <div id="status">
      Preparing secure connection...
    </div>

    <div id="authStatus"></div>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

    import {
      getAuth,
      signInAnonymously,
      onAuthStateChanged
    } from
      "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      getDoc,
      updateDoc,
      onSnapshot,
      serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyCz2DVsAyjUWiKLxChzPWhPO5Dg4BaddEM",
      authDomain: "reach-prototype-d70ef.firebaseapp.com",
      projectId: "reach-prototype-d70ef",
      storageBucket: "reach-prototype-d70ef.firebasestorage.app",
      messagingSenderId: "250530646851",
      appId: "1:250530646851:web:a2087cbf72cde0ffa5fdf6"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let activeRoom = null;
    let unsubscribeRoom = null;

    const createButton = document.getElementById("createButton");
    const joinButton = document.getElementById("joinButton");
    const status = document.getElementById("status");
    const authStatus = document.getElementById("authStatus");


    function setReady() {
      createButton.disabled = false;
      joinButton.disabled = false;

      createButton.textContent = "Create room";
      joinButton.textContent = "Join room";

      status.textContent = "🔒 Secure connection ready";
    }


    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        setReady();

        authStatus.textContent =
          "Authenticated device • " +
          user.uid.substring(0, 8);
      }
    });


    signInAnonymously(auth).catch((error) => {
      console.error(error);
      status.textContent =
        "⚠️ Could not authenticate this device.";
    });


    function makeRoomCode() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let code = "";

      for (let i = 0; i < 6; i++) {
        code += chars.charAt(
          Math.floor(Math.random() * chars.length)
        );
      }

      return code;
    }


    function watchRoom(code) {
      if (unsubscribeRoom) {
        unsubscribeRoom();
      }

      const roomRef = doc(db, "rooms", code);

      unsubscribeRoom = onSnapshot(
        roomRef,

        (snapshot) => {
          if (!snapshot.exists()) return;

          const room = snapshot.data();

          if (
            room.partnerUid &&
            currentUser &&
            room.hostUid === currentUser.uid
          ) {
            status.innerHTML =
              '<span class="heart">❤️</span> Partner connected to room ' +
              code;
          }
        },

        (error) => {
          console.error(error);
        }
      );
    }


    window.createRoom = async function () {
      if (!currentUser) {
        status.textContent =
          "Still authenticating. Try again in a moment.";
        return;
      }

      const code = makeRoomCode();
      const roomRef = doc(db, "rooms", code);

      try {
        await setDoc(roomRef, {
          hostUid: currentUser.uid,
          partnerUid: null,
          createdAt: serverTimestamp(),
          active: true
        });

        activeRoom = code;

        document.getElementById("roomCode").textContent = code;

        status.textContent =
          "💜 Room created. Send " +
          code +
          " to your partner.";

        watchRoom(code);

      } catch (error) {
        console.error(error);

        status.textContent =
          "🔒 Database is locked. We need to publish the new authenticated Firestore rules next.";
      }
    };


    window.joinRoom = async function () {
      if (!currentUser) {
        status.textContent =
          "Still authenticating. Try again in a moment.";
        return;
      }

      const input =
        document.getElementById("joinCode");

      const code =
        input.value.trim().toUpperCase();

      if (code.length !== 6) {
        status.textContent =
          "Enter the 6-character room code.";
        return;
      }

      const roomRef = doc(db, "rooms", code);

      try {
        const snapshot = await getDoc(roomRef);

        if (!snapshot.exists()) {
          status.textContent =
            "Room not found. Check the code.";
          return;
        }

        const room = snapshot.data();

        if (!room.active) {
          status.textContent =
            "That room is no longer active.";
          return;
        }

        await updateDoc(roomRef, {
          partnerUid: currentUser.uid,
          partnerJoinedAt: serverTimestamp()
        });

        activeRoom = code;

        status.innerHTML =
          '<span class="heart">❤️</span> Partner connected to room ' +
          code;

        watchRoom(code);

      } catch (error) {
        console.error(error);

        status.textContent =
          "🔒 Database is locked. We need to publish the new authenticated Firestore rules next.";
      }
    };
  </script>
</body>
</html>
