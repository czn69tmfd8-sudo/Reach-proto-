name: REACH source checks
on:
  pull_request:
  push:
    branches:
      - main
      - staging
      - feature/**
      - fix/**
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-environments.mjs
      - run: node scripts/check-kitchen.mjs
