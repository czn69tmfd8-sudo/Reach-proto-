name: REACH isolated token permission probe
on:
  push:
    branches:
      - test/adventure-book-transfer-feasibility-20261111
    paths:
      - .github/workflows/reach-transfer-permission-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  isolated-permission-probe:
    if: github.repository == 'czn69tmfd8-sudo/Reach-proto-' && github.ref == 'refs/heads/test/adventure-book-transfer-feasibility-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect token access and write synthetic marker to test branch only
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$BRANCH" = "test/adventure-book-transfer-feasibility-20261111"
          python3 - <<'PY'
          import base64, json, os, urllib.request, urllib.error
          repo = os.environ['REPO']
          branch = os.environ['BRANCH']
          url = f"{os.environ['API']}/repos/{repo}/contents/transfer-test/workflow-permission-proof.txt"
          content = b"REACH synthetic workflow permission probe\nNo recovered material.\n"
          body = json.dumps({'message': 'test: verify workflow token write on isolated branch only', 'content': base64.b64encode(content).decode('ascii'), 'branch': branch}).encode()
          request = urllib.request.Request(url, data=body, method='PUT', headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  data=json.load(response)
                  print('synthetic_write_status:',response.status)
                  print('synthetic_commit_sha:',data['commit']['sha'])
                  print('synthetic_blob_sha:',data['content']['sha'])
          except urllib.error.HTTPError as error:
              print('synthetic_write_status:',error.code)
              print('synthetic_write_failed; no credentials printed')
              raise SystemExit(1)
          PY
