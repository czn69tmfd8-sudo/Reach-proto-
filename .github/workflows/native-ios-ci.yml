name: Native iOS CI

on:
  push:
    branches:
      - native-reach
      - feature/video-call-polish
      - feature/adventure-book-foundation
      - feature/adventure-book-gallery-pagination
      - integration/adventure-book-video-calling
      - feature/adventure-book-single-app-integration
      - feature/adventure-book-visual-fidelity
      - feature/adventure-book-approved-integration
      - build-7-small-visual-fixes
      - fix/build7-daily-moment-swift-keypath
      - diagnose-staging-hand-auth
      - fix-staging-room-auth-diagnostics
    paths:
      - "native/**"
      - ".github/workflows/native-ios-ci.yml"
  workflow_dispatch:

concurrency:
  # Keep the current Adventure Book validation behind its own branch-local
  # queue while the earlier pagination checkpoints finish in the old queue.
  group: native-ios-ci-${{ github.ref }}${{ github.ref == 'refs/heads/feature/adventure-book-gallery-pagination' && '-native-preview-validation' || '' }}
  cancel-in-progress: false
  queue: max

jobs:
  swift-domain-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report release source fingerprint
        run: |
          set -euo pipefail
          git ls-tree -rz HEAD -- native/REACH native/REACHTests native/Configuration native/project.yml | sha256sum
          echo "REACH release source fingerprint above; compare with archive-only release gate."

      - name: Compile Swift 6 policies and run portable tests
        env:
          REACH_PORTABLE_LOADER_TRACE: "1"
        run: python3 native/scripts/run-portable-tests.py

      - name: Preserve portable runtime failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portable-swift-failure
          path: native/build-logs/portable-failure/
          if-no-files-found: ignore

  build-and-test:
    # Standard Intel runner avoids the observed arm64 capacity cancellations.
    # Codemagic continues validating on Apple Silicon. Device builds remain arm64.
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select installed Xcode
        run: |
          set -euo pipefail
          # GitHub-hosted macOS images change their preinstalled Xcode versions.
          # Use the runner's supported default instead of pinning an absent path.
          xcode-select -p
          xcodebuild -version

      - name: Toolchain diagnostics
        run: |
          sw_vers
          ls -1 /Applications | grep '^Xcode' || true
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Measure Apple JPEG encoder on travel photographs
        if: github.ref == 'refs/heads/feature/adventure-book-gallery-pagination' || github.ref == 'refs/heads/integration/adventure-book-video-calling'
        continue-on-error: true
        run: bash native/scripts/run-adventure-photo-benchmark.sh

      - name: Validate distribution preparation and packaging
        run: python3 -m unittest discover -s native/scripts -p 'test_*.py'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: native
        run: xcodegen generate

      - name: Resolve Swift packages
        working-directory: native
        run: xcodebuild -resolvePackageDependencies -project REACH.xcodeproj -scheme REACH

      - name: Select iPhone simulator
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; ids=[x["udid"] for runtime, xs in d.items() if runtime.startswith("com.apple.CoreSimulator.SimRuntime.iOS-") for x in xs if x.get("isAvailable") and x["name"].startswith("iPhone")]; sys.exit("No available iPhone simulator found") if not ids else print(ids[0])')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"

      - name: Build for simulator
        working-directory: native
        run: |
          set -euo pipefail
          mkdir -p build-logs
          xcodebuild \
            -project REACH.xcodeproj \
            -scheme REACH \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath DerivedData \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY="-" \
            build 2>&1 | tee build-logs/build.log

      - name: Capture fullscreen calling interface
        if: github.ref == 'refs/heads/feature/video-call-polish' || github.ref == 'refs/heads/integration/adventure-book-video-calling'
        working-directory: native
        run: bash scripts/capture-call-simulator.sh

      - name: Upload fullscreen call screenshots
        if: github.ref == 'refs/heads/feature/video-call-polish' || github.ref == 'refs/heads/integration/adventure-book-video-calling'
        uses: actions/upload-artifact@v4
        with:
          name: reach-fullscreen-call-screenshots
          path: native/build-logs/call-visual/
          if-no-files-found: error

      - name: Launch REACH on iPhone simulator
        working-directory: native
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" DerivedData/Build/Products/Debug-iphonesimulator/REACH.app
          xcrun simctl launch "$DEVICE_ID" com.reachprototype.app

      - name: Run unit tests with simulator signing and diagnostics
        working-directory: native
        run: bash scripts/run-simulator-tests.sh

      - name: Capture offline Adventure Book reference screens
        working-directory: native
        run: |
          set -euo pipefail
          bash scripts/capture-adventure-simulator.sh

      - name: Compile physical iPhone code without signing credentials
        working-directory: native
        run: |
          set -euo pipefail
          mkdir -p build-logs
          xcodebuild -project REACH.xcodeproj -scheme REACH -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-logs/device-compile.log

      - name: Preserve native build and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-validation
          path: |
            native/build-logs/
            native/TestResults.xcresult/
          if-no-files-found: ignore
