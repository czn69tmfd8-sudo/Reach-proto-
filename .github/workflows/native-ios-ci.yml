name: Native iOS CI

on:
  push:
    branches:
      - native-reach
    paths:
      - "native/**"
      - ".github/workflows/native-ios-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "native/**"
      - ".github/workflows/native-ios-ci.yml"
  workflow_dispatch:

concurrency:
  group: native-ios-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  swift-domain-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Typecheck platform-independent session logic
        run: |
          set -euo pipefail
          swiftc -swift-version 6 -typecheck \
            native/REACH/Models/ConnectionState.swift \
            native/REACH/Models/ReachSessionFreshness.swift \
            native/REACH/Models/ReachJoinPolicy.swift \
            native/REACH/Models/ReachSessionLifecycle.swift \
            native/REACH/Models/ReachConnectionMachine.swift

  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select installed Xcode
        run: |
          set -euo pipefail
          # GitHub-hosted macOS images change their preinstalled Xcode versions.
          # Use the runner's supported default instead of pinning an absent path.
          xcode-select -p
          xcodebuild -version

      - name: Toolchain diagnostics
        run: |
          sw_vers
          ls -1 /Applications | grep '^Xcode' || true
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: native
        run: xcodegen generate

      - name: Resolve Swift packages
        working-directory: native
        run: xcodebuild -resolvePackageDependencies -project REACH.xcodeproj -scheme REACH

      - name: Build for simulator
        working-directory: native
        run: |
          set -o pipefail
          xcodebuild \
            -project REACH.xcodeproj \
            -scheme REACH \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests
        working-directory: native
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; ids=[x["udid"] for runtime, xs in d.items() if runtime.startswith("com.apple.CoreSimulator.SimRuntime.iOS-") for x in xs if x.get("isAvailable") and x["name"].startswith("iPhone")]; sys.exit("No available iPhone simulator found") if not ids else print(ids[0])')
          xcodebuild \
            -project REACH.xcodeproj \
            -scheme REACH \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test
