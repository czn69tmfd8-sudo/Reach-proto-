name: Native iOS CI

on:
  push:
    branches:
      - native-reach
    paths:
      - "native/**"
      - ".github/workflows/native-ios-ci.yml"
  workflow_dispatch:

concurrency:
  group: native-ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: native
        run: xcodegen generate

      - name: Show destinations
        working-directory: native
        run: xcodebuild -project REACH.xcodeproj -scheme REACH -showdestinations

      - name: Build for simulator
        working-directory: native
        run: |
          set -o pipefail
          xcodebuild \
            -project REACH.xcodeproj \
            -scheme REACH \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests
        working-directory: native
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime, xs in d.items() if "iOS" in runtime for x in xs if x["name"].startswith("iPhone")))')
          xcodebuild \
            -project REACH.xcodeproj \
            -scheme REACH \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test
