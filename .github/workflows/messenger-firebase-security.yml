name: Messenger Firestore emulator
on:
  push:
    branches:
      - feature/messenger
    paths:
      - 'native/firebase/**'
      - '.github/workflows/messenger-firebase-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native/firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/firebase/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Assemble the Build 21 rules baseline
        run: |
          node prepare-shared-adventure-rules.mjs reviews/staging-2026-11-06-hardened/merged.rules adventure-book.shared-quota.generated
          node prepare-profile-photo-rules.mjs adventure-book.shared-quota.generated.rules profile-photos.generated.rules
      - name: Verify Messenger access rules in the emulator
        run: |
          npx firebase emulators:exec --only firestore --project demo-reach-messenger --config firebase.json 'node --test messenger.rules.emulator.mjs'
