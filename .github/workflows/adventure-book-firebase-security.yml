name: Adventure Book Firebase emulator security
on:
  push:
    branches:
      - feature/adventure-book-foundation
      - feature/adventure-book-gallery-pagination
      - integration/adventure-book-video-calling
      - fix/build17-adventure-book-sample-entry
      - feature/live-shared-adventure-book
      - fix/build18-shared-adventure-book
      - fix/build19-emergency
      - feature/build20-profile-and-adventure-book
      - fix/build21-call-controls
      - integration/build21-messenger-call-controls
      - fix/build22-home-stability
      - fix/build23-pairing-call-state
      - fix/build24-home-call-readiness
      - fix/build25-home-reliability
      - fix/build26-home-state-architecture
      - fix/build27-portrait-stability
      - release/build-23-preparation
    paths:
      # Recheck integration changes to the iOS client alongside candidate rules.
      - 'native/REACH/**'
      - 'native/firebase/adventure-book*'
      - 'native/firebase/*profile-photo*'
      - 'native/firebase/prepare-adventure-rules.mjs'
      - 'native/firebase/prepare-shared-adventure-rules.mjs'
      - 'native/firebase/merge-live-adventure-rules*'
      - '.github/workflows/adventure-book-firebase-security.yml'
      - '.github/workflows/native-ios-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native/firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/firebase/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Firebase emulator dependencies
        run: npm ci
      - name: Test fail-closed offline additive rules merge
        run: node --test merge-live-adventure-rules.test.mjs adventure-book-quota-plan.test.mjs
      - name: Assemble review-only Firestore rules
        run: |
          node prepare-adventure-rules.mjs
          node prepare-shared-adventure-rules.mjs reviews/staging-2026-11-06-hardened/merged.rules adventure-book.shared-quota.generated
          node prepare-profile-photo-rules.mjs adventure-book.shared-quota.generated.rules profile-photos.generated.rules
      - name: Run isolated Adventure Book Firestore security tests
        run: |
          printf '%s\n' '{"firestore":{"rules":"adventure-book.combined.generated.rules"},"storage":{"rules":"adventure-book.storage.proposed.rules"},"emulators":{"firestore":{"port":8080},"storage":{"port":9199},"ui":{"enabled":false}}}' > adventure-emulator.generated.json
          npx firebase emulators:exec --only firestore,storage --project demo-reach-adventure --config adventure-emulator.generated.json 'REACH_ENFORCEMENT_CANDIDATE=profile-photos.generated.rules node --test --test-concurrency=1 adventure-book.rules.test.mjs adventure-book.storage.test.mjs adventure-book.quota-candidate.test.mjs adventure-book.photo-payload-candidate.test.mjs profile-photos.test.mjs'
