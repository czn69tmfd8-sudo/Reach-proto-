name: Adventure Book Firebase emulator security
on:
  push:
    branches:
      - feature/adventure-book-foundation
      - feature/adventure-book-gallery-pagination
      - integration/adventure-book-video-calling
      - fix/build17-adventure-book-sample-entry
    paths:
      # Recheck integration changes to the iOS client alongside candidate rules.
      - 'native/REACH/**'
      - 'native/firebase/adventure-book*'
      - 'native/firebase/prepare-adventure-rules.mjs'
      - 'native/firebase/merge-live-adventure-rules*'
      - '.github/workflows/adventure-book-firebase-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native/firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/firebase/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Firebase emulator dependencies
        run: npm ci
      - name: Test fail-closed offline additive rules merge
        run: node --test merge-live-adventure-rules.test.mjs adventure-book-quota-plan.test.mjs
      - name: Assemble review-only Firestore rules
        run: node prepare-adventure-rules.mjs
      - name: Run isolated Adventure Book Firestore security tests
        run: |
          printf '%s\n' '{"firestore":{"rules":"adventure-book.combined.generated.rules"},"storage":{"rules":"adventure-book.storage.proposed.rules"},"emulators":{"firestore":{"port":8080},"storage":{"port":9199},"ui":{"enabled":false}}}' > adventure-emulator.generated.json
          npx firebase emulators:exec --only firestore,storage --project demo-reach-adventure --config adventure-emulator.generated.json 'node --test --test-concurrency=1 adventure-book.rules.test.mjs adventure-book.storage.test.mjs adventure-book.quota-candidate.test.mjs adventure-book.photo-payload-candidate.test.mjs'
