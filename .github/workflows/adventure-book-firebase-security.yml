name: Adventure Book Firebase emulator security
on:
  push:
    branches:
      - feature/adventure-book-foundation
    paths:
      - 'native/firebase/adventure-book*'
      - 'native/firebase/prepare-adventure-rules.mjs'
      - '.github/workflows/adventure-book-firebase-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native/firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/firebase/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Firebase emulator dependencies
        run: npm ci
      - name: Assemble review-only Firestore rules
        run: node prepare-adventure-rules.mjs
      - name: Run isolated Adventure Book Firestore security tests
        run: |
          printf '%s\n' '{"firestore":{"rules":"adventure-book.combined.generated.rules"},"emulators":{"firestore":{"port":8080},"ui":{"enabled":false}}}' > adventure-emulator.generated.json
          npx firebase emulators:exec --only firestore --project demo-reach-adventure --config adventure-emulator.generated.json 'node --test --test-concurrency=1 adventure-book.rules.test.mjs'
