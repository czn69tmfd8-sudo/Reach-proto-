workflows:
  reach-ios-simulator:
    name: REACH unsigned iPhone simulator
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - reach-staging
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: native-reach
          include: true
          source: true
      cancel_previous_builds: false
    scripts:
      - name: Verify branch and toolchain
        script: |
          set -euo pipefail
          test "$CM_BRANCH" = "native-reach"
          xcodebuild -version
          swift --version
      - name: Install optional staging Firebase configuration
        script: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import base64
          import os
          import pathlib
          import plistlib

          encoded = os.environ.get("REACH_STAGING_FIREBASE_PLIST_BASE64")
          if encoded:
              payload = base64.b64decode(encoded, validate=True)
              config = plistlib.loads(payload)
              if config.get("PROJECT_ID") != "reach-staging-a4745":
                  raise SystemExit("Firebase configuration must use reach-staging-a4745.")
              if config.get("BUNDLE_ID") != "com.reachprototype.app":
                  raise SystemExit("Firebase configuration bundle ID does not match REACH.")
              if not all(config.get(key) for key in ("GOOGLE_APP_ID", "API_KEY", "GCM_SENDER_ID")):
                  raise SystemExit("Firebase configuration is missing required fields.")
              pathlib.Path("native/REACH/GoogleService-Info.plist").write_bytes(payload)
              print("Staging Firebase configuration validated.")
          else:
              print("Building without Firebase configuration. Staging sign-in will be unavailable.")
          PYTHON
      - name: Generate Xcode project
        script: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
          cd native
          xcodegen generate
      - name: Resolve Firebase packages
        script: |
          set -euo pipefail
          cd native
          mkdir -p build-logs
          xcodebuild -resolvePackageDependencies -project REACH.xcodeproj -scheme REACH 2>&1 | tee build-logs/packages.log
      - name: Select available iPhone simulator
        script: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; ids=[d["udid"] for runtime, items in devices.items() if runtime.startswith("com.apple.CoreSimulator.SimRuntime.iOS-") for d in items if d.get("isAvailable") and d["name"].startswith("iPhone")]; sys.exit("No available iPhone simulator") if not ids else print(ids[0])')
          echo "DEVICE_ID=$DEVICE_ID" >> "$CM_ENV"
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Build unsigned simulator application
        script: |
          set -euo pipefail
          cd native
          xcodebuild -project REACH.xcodeproj -scheme REACH -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build-logs/build.log
      - name: Install and launch REACH
        script: |
          set -euo pipefail
          cd native
          xcrun simctl install "$DEVICE_ID" DerivedData/Build/Products/Debug-iphonesimulator/REACH.app
          xcrun simctl launch "$DEVICE_ID" com.reachprototype.app
          xcrun simctl io "$DEVICE_ID" screenshot build-logs/launch.png
      - name: Run native unit tests
        script: |
          set -euo pipefail
          cd native
          xcodebuild -project REACH.xcodeproj -scheme REACH -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath DerivedData -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee build-logs/tests.log
    artifacts:
      - native/build-logs/**
      - native/TestResults.xcresult
      - native/DerivedData/Build/Products/Debug-iphonesimulator/REACH.app
