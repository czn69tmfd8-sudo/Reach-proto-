name: REACH
options:
  bundleIdPrefix: com.reachprototype
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  REACH:
    type: application
    platform: iOS
    sources:
      - path: REACH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reachprototype.app
        PRODUCT_NAME: REACH
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: REACH
        INFOPLIST_KEY_NSCameraUsageDescription: "REACH uses your camera when you intentionally open or take your partner's hand for a video connection."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "REACH uses your microphone when you intentionally open or take your partner's hand for an audio/video connection."
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - REACHTests

  REACHTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: REACHTests
    dependencies:
      - target: REACH
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
